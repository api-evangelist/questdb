description: >-
  QuestDB ships in three editions: open-source (Apache 2.0) self-managed,
  Enterprise (self-hosted commercial license with HA, security, tiered storage)
  and BYOC (Bring Your Own Cloud — QuestDB operates the database in your AWS or
  Azure account). The previously offered fully-managed QuestDB Cloud has been
  retired in favor of BYOC + Enterprise. Pricing is not publicly listed; quotes
  are by sales / AWS Marketplace private offers.
notes: >-
  Public list pricing for Enterprise / BYOC is not published. Tiers below
  reflect editions only; numeric prices remain unreconciled.
