principles:
- name: Visibility
  description: Combine QuestDB invoice (license) with cloud cost-export (FOCUS) on the QuestDB-tagged resources.
- name: Allocation
  description: Tag QuestDB instances and storage with project / team / environment in AWS / Azure for downstream allocation.
- name: Optimization
  description: Use Hypercore-style tiered storage in Enterprise to push cold partitions to S3-class storage; right-size instance class to ingestion throughput.
- name: Accountability
  description: Assign an Enterprise contract owner; assign cloud-account owner for infra spend.
