description: >-
  FOCUS-aligned FinOps profile for QuestDB. The dominant cost surfaces are
  (a) the underlying infrastructure (your AWS/Azure/GCP compute, EBS/SSD,
  network egress) for OSS and BYOC deployments and (b) the QuestDB Enterprise
  / BYOC commercial license. There is no managed-service per-row, per-query or
  per-MAU charge.
notes: >-
  In BYOC, the cloud invoice (AWS/Azure) carries the infra costs; QuestDB
  Enterprise license/management is invoiced separately. Costs allocate
  cleanly via cloud-account tags on the QuestDB instance(s).
